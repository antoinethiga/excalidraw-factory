name: CI

on:
  pull_request:
  push:
    branches-ignore:
      # evidence branches only hold screenshots and reports, no project code
      - "factory/*-evidence"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn test:typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: ESLint
        run: yarn test:code
      - name: Prettier
        run: yarn test:other

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Tests
        run: yarn test:app --watch=false
